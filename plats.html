<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0907">
  <meta name="description" content="Nouvelle carte déjeuner et dîner du Wellington Steakhouse à Basse-Terre.">
  <title>Carte des plats | Wellington Steakhouse</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0907;
      --surface: #17110c;
      --text: #f4ead8;
      --muted: #cdbb9d;
      --gold: #d8a719;
      --border: rgba(216, 167, 25, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(circle at top, rgba(107, 69, 25, 0.22), transparent 32rem),
        var(--background);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a {
      color: inherit;
    }

    .skip-link {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 20;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      background: var(--text);
      color: var(--background);
      transform: translateY(-180%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--border);
      background: rgba(11, 9, 7, 0.9);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }

    .navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: min(100% - 2rem, 72rem);
      min-height: 4.2rem;
      margin-inline: auto;
    }

    .brand {
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 2.6vw, 1.25rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .navigation-links {
      display: flex;
      align-items: center;
      gap: clamp(0.8rem, 3vw, 1.5rem);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .navigation-links a {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 650;
      text-decoration: none;
    }

    .navigation-links a:hover,
    .navigation-links a:focus-visible {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 0.3rem;
    }

    main {
      width: min(100% - 2rem, 72rem);
      margin-inline: auto;
      padding: clamp(1.4rem, 4vw, 3rem) 0 clamp(3rem, 7vw, 6rem);
    }

    .page-heading {
      margin: 0 0 clamp(1.5rem, 4vw, 2.75rem);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 0.45rem;
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 5vw, 3rem);
      line-height: 1.12;
    }

    .updated {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .menu-pages {
      display: grid;
      gap: clamp(1.1rem, 3vw, 2.25rem);
      justify-items: center;
    }

    .menu-page {
      width: min(100%, 61rem);
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      background: var(--surface);
      box-shadow: 0 1.4rem 4rem rgba(0, 0, 0, 0.34);
    }

    .menu-page img {
      display: block;
      width: 100%;
      height: auto;
      background: #080604;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .site-footer {
      padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
    }

    .site-footer a {
      color: var(--gold);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 36rem) {
      .navigation {
        width: min(100% - 1.25rem, 72rem);
      }

      .navigation-links {
        gap: 0.75rem;
      }

      .navigation-links a {
        font-size: 0.82rem;
      }

      main {
        width: min(100% - 1rem, 72rem);
      }

      .menu-page {
        border-radius: 0.2rem;
      }
    }

    @media print {
      :root {
        color-scheme: light;
      }

      body,
      main {
        width: 100%;
        padding: 0;
        background: #fff;
      }

      .site-header,
      .page-heading,
      .site-footer {
        display: none;
      }

      .menu-pages {
        display: block;
      }

      .menu-page {
        width: 100%;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        break-after: page;
      }

      .menu-page:last-child {
        break-after: auto;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#nouvelle-carte">Aller à la nouvelle carte</a>

  <header class="site-header">
    <nav class="navigation" aria-label="Navigation principale">
      <a class="brand" href="index.html">Wellington</a>
      <ul class="navigation-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="boissons.html">Boissons</a></li>
      </ul>
    </nav>
  </header>

  <main id="nouvelle-carte">
    <header class="page-heading">
      <p class="eyebrow">Déjeuner &amp; dîner</p>
      <h1>La nouvelle carte</h1>
      <p class="updated">Steakhouse · Breakfast · Bar</p>
    </header>

    <section class="menu-pages" aria-label="Menu complet du Wellington">
      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-01.webp" width="1956" height="2721" alt="Couverture du nouveau menu déjeuner et dîner du Wellington" fetchpriority="high">
        <figcaption class="visually-hidden">Couverture de la carte</figcaption>
      </figure>

      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-02.webp" width="1956" height="2721" alt="Présentation de l'esprit Wellington" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">L'esprit Wellington</figcaption>
      </figure>

      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-03.webp" width="1956" height="2721" alt="L'instant apéro et le menu kids" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">L'instant apéro et menu kids</figcaption>
      </figure>

      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-04.webp" width="1956" height="2721" alt="Les entrées pour commencer et les salades" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">Pour commencer et les salades</figcaption>
      </figure>

      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-05.webp" width="1956" height="2721" alt="Meat Corner : viandes grillées, viandes d'exception, sauces et accompagnements" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">Meat Corner</figcaption>
      </figure>

      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-06.webp" width="1956" height="2721" alt="Burger Corner et Fish Corner" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">Burger Corner et Fish Corner</figcaption>
      </figure>

      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-07.webp" width="1956" height="2721" alt="Desserts, parfums de glaces et compositions glacées" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">Desserts et glaces</figcaption>
      </figure>

      <figure class="menu-page">
        <img src="assets/menu-2026-08/menu-wellington-08.webp" width="1956" height="2721" alt="Coordonnées, adresse et réseaux sociaux du Wellington" loading="lazy" decoding="async">
        <figcaption class="visually-hidden">Coordonnées du Wellington</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <a href="tel:+590590867043">0590 86 70 43</a>
    <span aria-hidden="true"> · </span>
    <span>2 rue Amédée Fengarol, 97100 Basse-Terre</span>
  </footer>
</body>
</html>
